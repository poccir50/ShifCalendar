name: Build native iOS AlarmKit app

on:
  push:
    paths:
      - 'native-ios/ShiftMateAlarmKit_iOS26.zip'
      - '.github/workflows/build-native-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Unpack native project
        run: unzip -q native-ios/ShiftMateAlarmKit_iOS26.zip
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ShiftMateAlarmKit/ShiftMateAlarm.xcodeproj \
            -scheme ShiftMateAlarm \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
