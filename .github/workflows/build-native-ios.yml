name: Validate native iOS AlarmKit app

on:
  push:
    paths:
      - 'native-ios-src/**'
      - '.github/workflows/build-native-ios.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Typecheck against iOS 26.1 Simulator SDK
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -module-name ShiftMateAlarm \
            -target arm64-apple-ios26.1-simulator \
            -sdk "$SDK" \
            native-ios-src/ShiftMateAlarmApp.swift \
            native-ios-src/ShiftEngine.swift \
            native-ios-src/AlarmScheduler.swift \
            native-ios-src/ContentView.swift
