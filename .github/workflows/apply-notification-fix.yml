name: Apply ShiftMate notification fix

on:
  push:
    paths:
      - '.github/workflows/apply-notification-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_notifications.py
      - name: Commit patched app
        run: |
          git config user.name "ShiftMate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icon.svg
          git commit -m "Fix iPhone PWA notifications"
          git push
