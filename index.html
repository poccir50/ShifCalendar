<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShiftMate">
<title>ShiftMate · 교대근무 달력</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:650px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:16px;box-shadow:0 8px 25px #0000000d}.top{display:flex;justify-content:space-between;align-items:flex-start}.top h1{margin:0;font-size:24px}.sub{color:#6b7280;font-size:13px;margin-top:4px}.gear,.nav{border:0;background:#f3f4f6;border-radius:11px;padding:10px 14px;font-size:18px}.status{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.mini{background:#f9fafb;border:1px solid #e5e7eb;border-radius:15px;padding:12px}.mini small{color:#6b7280}.big{font-size:19px;font-weight:850;margin:3px 0}.desc{font-size:11px;color:#6b7280;line-height:1.4}.monthbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}#monthTitle{font-size:20px;font-weight:850}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;color:#6b7280;font-size:12px;font-weight:750;padding:5px}.sun{color:#dc2626}.sat{color:#2563eb}.day{min-height:98px;border:1px solid #e5e7eb;border-radius:11px;padding:5px 2px;text-align:center;background:#fff;overflow:hidden}.empty{border:0;background:transparent}.date{font-size:13px;font-weight:850;margin-bottom:5px}.today{outline:3px solid #111827;outline-offset:1px}.badge{display:inline-block;border-radius:7px;padding:3px 6px;font-size:9px;font-weight:850}.주간{background:#fef3c7;color:#92400e}.야간{background:#dbeafe;color:#1d4ed8}.휴무{background:#f3f4f6;color:#6b7280}.holiday{background:#fff1f2;border-color:#fda4af}.holiday.long{background:#ffe4e6}.hname{font-size:8px;color:#be123c;font-weight:800;line-height:1.15;margin-top:4px}.note{font-size:7px;color:#4338ca;background:#eef2ff;border-radius:4px;margin-top:3px;padding:2px}.ev{font-size:7px;color:#075985;background:#e0f2fe;border-radius:4px;margin-top:3px;padding:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.legend span{font-size:9px;padding:4px 7px;border-radius:999px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.btn{border:0;border-radius:11px;padding:11px;font-weight:800;background:#f3f4f6}.primary{background:#111827;color:#fff}.warn{margin-top:12px;background:#fff7ed;color:#9a3412;border-radius:11px;padding:10px;font-size:10px;line-height:1.5}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#11182777;padding:14px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:100%;max-width:500px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:17px}.mhead{display:flex;justify-content:space-between;align-items:center}.mhead h2{margin:0;font-size:20px}.close{border:0;background:#f3f4f6;border-radius:50%;width:35px;height:35px;font-size:20px}.box{margin-top:10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:11px;padding:10px;font-size:12px}.section{border-top:1px solid #e5e7eb;margin-top:16px;padding-top:15px}.section:first-of-type{border-top:0}.stitle{font-weight:850;font-size:14px}.help{color:#6b7280;font-size:10px;line-height:1.45;margin-top:3px}.field{margin-top:10px}.field label{display:block;color:#6b7280;font-size:11px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;font-size:16px;background:#fff}.field textarea{min-height:65px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{margin-top:9px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:9px;margin-bottom:6px}.it{font-size:12px;font-weight:800}.im{font-size:10px;color:#6b7280;margin-top:2px}.ib{display:flex;gap:4px}.small{border:0;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800}.edit{background:#e5e7eb}.del{background:#fee2e2;color:#991b1b}.tabs{display:flex;gap:5px;background:#f3f4f6;padding:4px;border-radius:11px;margin-top:12px}.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-size:11px;font-weight:800}.tab.on{background:#fff}.panel{display:none}.panel.on{display:block}.emptyState{text-align:center;background:#fafafa;color:#6b7280;border-radius:9px;padding:11px;font-size:11px}@media(max-width:480px){.app{padding:5px}.card{padding:12px}.day{min-height:92px}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><div class="card">
<div class="top"><div><h1>ShiftMate</h1><div id="subtitle" class="sub"></div></div><button class="gear" onclick="openSettings()">⚙️</button></div>
<div class="status"><div class="mini"><small>오늘</small><div id="todayBig" class="big"></div><div id="todayDesc" class="desc"></div></div><div class="mini"><small>다음 주간 기상</small><div id="wakeBig" class="big"></div><div id="wakeDesc" class="desc"></div></div></div>
<div class="monthbar"><button class="nav" onclick="move(-1)">◀</button><div id="monthTitle"></div><button class="nav" onclick="move(1)">▶</button></div>
<div class="week"><div class="weekday sun">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday sat">토</div></div>
<div id="cal" class="cal"></div>
<div class="legend"><span class="주간">주간</span><span class="야간">야간</span><span class="휴무">휴무</span><span style="background:#ffe4e6;color:#be123c">회사휴무·연휴</span><span style="background:#e0f2fe;color:#075985">개인일정</span></div>
<div class="actions"><button class="btn" onclick="today()">오늘로</button><button class="btn" onclick="quickAdd()">+ 일정 추가</button><button class="btn" onclick="askNotify()">🔔 알림 권한</button><button class="btn" onclick="exportBackup()">💾 백업</button></div>
<div class="warn">웹앱의 04:50 알림은 iPhone에서 앱이 닫혀 있으면 정확한 시각에 울린다고 보장할 수 없습니다. 실제 기상용으로는 아이폰 시계 알람을 함께 유지하는 것을 권장합니다.</div>
</div></div>

<div id="eventModal" class="overlay"><div class="modal"><div class="mhead"><h2 id="eventDate"></h2><button class="close" onclick="closeM('eventModal')">×</button></div><div id="shiftBox" class="box"></div><div class="section"><div class="stitle">등록된 일정</div><div id="eventList" class="list"></div></div><div class="section"><div class="stitle">일정 추가 / 수정</div><input id="editEventId" type="hidden"><div class="field"><label>일정명</label><input id="eventTitle" placeholder="예: 치과, 약속"></div><div class="g2"><div class="field"><label>시간</label><input id="eventTime" type="time"></div><div class="field"><label>알림</label><select id="eventReminder"><option value="none">없음</option><option value="10">10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option><option value="1440">하루 전</option></select></div></div><div class="field"><label>메모</label><textarea id="eventMemo"></textarea></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveEvent()">일정 저장</button></div></div></div>

<div id="settingsModal" class="overlay"><div class="modal"><div class="mhead"><h2>설정</h2><button class="close" onclick="closeM('settingsModal')">×</button></div><div class="tabs"><button id="tw" class="tab on" onclick="tab('work')">근무</button><button id="th" class="tab" onclick="tab('holiday')">회사달력</button><button id="td" class="tab" onclick="tab('data')">데이터</button></div>
<div id="pw" class="panel on"><div class="section"><div class="stitle">교대근무 설정</div><div class="field"><label>조 이름</label><input id="sTeam"></div><div class="g2"><div class="field"><label>주간 시작</label><input id="sDS" type="time"></div><div class="field"><label>주간 종료</label><input id="sDE" type="time"></div></div><div class="g2"><div class="field"><label>야간 시작</label><input id="sNS" type="time"></div><div class="field"><label>야간 종료</label><input id="sNE" type="time"></div></div><div class="field"><label>주간 기상시간</label><input id="sWake" type="time"></div><div class="g2"><div class="field"><label>교대 기준일</label><input id="sBase" type="date"></div><div class="field"><label>기준 주</label><select id="sBaseShift"><option>주간</option><option>야간</option></select></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveSettings()">설정 저장</button></div></div>
<div id="ph" class="panel"><div class="section"><div class="stitle">연도별 회사 휴무</div><div class="help">새해 달력이 나오면 연도를 추가하고 휴무를 등록하면 됩니다.</div><div class="g2"><div class="field"><label>관리 연도</label><select id="hYear" onchange="renderHolidayList()"></select></div><div class="field"><label>새 연도</label><button class="btn" style="width:100%" onclick="addYear()">+ 연도 추가</button></div></div><div id="holidayList" class="list"></div></div><div class="section"><div class="stitle">휴무 추가 / 수정</div><input id="hEdit" type="hidden"><div class="field"><label>휴무명</label><input id="hName" placeholder="예: 하기휴무"></div><div class="g2"><div class="field"><label>시작일</label><input id="hStart" type="date"></div><div class="field"><label>종료일</label><input id="hEnd" type="date"></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveHoliday()">휴무 저장</button></div></div>
<div id="pd" class="panel"><div class="section"><div class="stitle">백업 / 복원</div><div class="help">일정·설정·회사휴무를 JSON 파일로 보관합니다.</div><button class="btn" style="width:100%;margin-top:10px" onclick="exportBackup()">백업 내보내기</button><div class="field"><label>백업 파일</label><input id="backupFile" type="file" accept=".json"></div><button class="btn" style="width:100%;margin-top:8px" onclick="importBackup()">백업 복원</button></div><div class="section"><div class="stitle">초기화</div><button class="btn" style="width:100%;margin-top:10px" onclick="resetApp()">모든 사용자 데이터 초기화</button></div></div>
</div></div>

<script>
const DEF={team:'A조',ds:'06:45',de:'15:30',ns:'15:35',ne:'00:20',wake:'04:50',base:'2026-08-10',baseShift:'주간'};
const H26=[['2026-01-01','2026-01-02','신정휴무'],['2026-02-16','2026-02-19','설날휴무'],['2026-03-01','2026-03-01','삼일절'],['2026-05-01','2026-05-01','근로자의날'],['2026-05-04','2026-05-04','근무일조정 휴무'],['2026-05-05','2026-05-05','어린이날'],['2026-05-24','2026-05-24','석가탄신일'],['2026-05-25','2026-05-25','대체휴일 · 회사창립기념일'],['2026-06-03','2026-06-03','지방선거'],['2026-06-06','2026-06-06','현충일'],['2026-07-17','2026-07-17','제헌절'],['2026-08-03','2026-08-07','하기휴무'],['2026-08-15','2026-08-15','광복절'],['2026-08-17','2026-08-17','대체휴일'],['2026-09-24','2026-09-28','추석휴무'],['2026-10-03','2026-10-03','개천절'],['2026-10-05','2026-10-05','대체휴일'],['2026-10-09','2026-10-09','한글날'],['2026-10-24','2026-10-24','노조창립일'],['2026-12-25','2026-12-25','성탄절']].map(x=>({start:x[0],end:x[1],name:x[2]}));
const NOTES={'2026-03-02':'정상근무 · 5/4와 근무일 조정','2026-04-05':'식목일','2026-09-23':'B조 추석연휴 전일 미가동','2026-12-31':'B조 연말 4시간 미가동'};
let S=JSON.parse(localStorage.getItem('sm.s')||'null')||{...DEF};let H=JSON.parse(localStorage.getItem('sm.h')||'null')||{'2026':H26};let E=JSON.parse(localStorage.getItem('sm.e')||'{}');let view=new Date(),sel='';
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
function save(){localStorage.setItem('sm.s',JSON.stringify(S));localStorage.setItem('sm.h',JSON.stringify(H));localStorage.setItem('sm.e',JSON.stringify(E))}function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function holiday(d){let k=key(d);return(H[String(d.getFullYear())]||[]).find(x=>k>=x.start&&k<=x.end)||null}function mon(d){let c=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=c.getDay();c.setDate(c.getDate()+(n===0?-6:1-n));return c}
function shift(d){if(holiday(d)||d.getDay()===0||d.getDay()===6)return'휴무';let w=Math.round((mon(d)-mon(parse(S.base)))/604800000),even=Math.abs(w%2)===0;return S.baseShift==='주간'?(even?'주간':'야간'):(even?'야간':'주간')}
function nextWake(){let n=new Date();for(let i=0;i<370;i++){let d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(shift(d)==='주간'){let [h,m]=S.wake.split(':').map(Number),x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);if(x>n)return x}}return null}
function render(){document.getElementById('subtitle').textContent=`${S.team} · 주간/야간 2교대`;let n=new Date(),sh=shift(n),ho=holiday(n);todayBig.textContent=sh;todayDesc.textContent=ho?ho.name:sh==='주간'?`${S.ds}~${S.de} · 기상 ${S.wake}`:sh==='야간'?`${S.ns}~${S.ne} · 오전 알림 없음`:'쉬는 날';let nw=nextWake();wakeBig.textContent=nw?S.wake:'—';wakeDesc.textContent=nw?`${nw.getMonth()+1}/${nw.getDate()} 주간근무`:'예정 없음';renderCal()}
function renderCal(){let y=view.getFullYear(),m=view.getMonth();monthTitle.textContent=`${y}년 ${m+1}월`;cal.innerHTML='';let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),now=new Date();for(let i=0;i<first;i++){let x=document.createElement('div');x.className='day empty';cal.appendChild(x)}for(let d=1;d<=last;d++){let dt=new Date(y,m,d),k=key(dt),sh=shift(dt),ho=holiday(dt),x=document.createElement('div');x.className='day '+(dt.getDay()===0?'sun ':dt.getDay()===6?'sat ':'')+(ho?'holiday ':'')+(ho&&ho.start!==ho.end?'long ':'');if(key(now)===k)x.classList.add('today');x.onclick=()=>openDate(dt);let html=`<div class="date">${d}</div><span class="badge ${sh}">${sh}</span>`;if(ho)html+=`<div class="hname">${esc(ho.name)}</div>`;if(NOTES[k])html+=`<div class="note">${esc(NOTES[k])}</div>`;if(E[k]?.length){let ev=[...E[k]].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))[0];html+=`<div class="ev">${ev.time?ev.time+' ':''}${esc(ev.title)}</div>`;if(E[k].length>1)html+=`<div class="ev">+${E[k].length-1}개</div>`}x.innerHTML=html;cal.appendChild(x)}}
function move(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}function today(){view=new Date();render()}
function openDate(d){sel=key(d);eventDate.textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;let sh=shift(d),ho=holiday(d);shiftBox.textContent=ho?`휴무 · ${ho.name}`:sh==='주간'?`☀️ 주간 ${S.ds}~${S.de}`:sh==='야간'?`🌙 야간 ${S.ns}~${S.ne}`:'휴무';clearEvent();renderEvents();eventModal.classList.add('open')}function quickAdd(){openDate(new Date())}
function clearEvent(){editEventId.value='';eventTitle.value='';eventTime.value='';eventReminder.value='none';eventMemo.value=''}function saveEvent(){let t=eventTitle.value.trim();if(!t)return alert('일정명을 입력해주세요.');let id=editEventId.value||String(Date.now()),o={id,title:t,time:eventTime.value,rem:eventReminder.value,memo:eventMemo.value.trim()};E[sel]=E[sel]||[];let i=E[sel].findIndex(x=>x.id===id);i>=0?E[sel][i]=o:E[sel].push(o);save();clearEvent();renderEvents();render()}
function renderEvents(){let a=E[sel]||[];eventList.innerHTML=a.length?a.map(o=>`<div class="item"><div><div class="it">${esc(o.title)}</div><div class="im">${o.time||'시간 미지정'}${o.memo?' · '+esc(o.memo):''}</div></div><div class="ib"><button class="small edit" onclick="editEvent('${o.id}')">수정</button><button class="small del" onclick="delEvent('${o.id}')">삭제</button></div></div>`).join(''):'<div class="emptyState">등록된 일정이 없습니다.</div>'}function editEvent(id){let o=(E[sel]||[]).find(x=>x.id===id);if(!o)return;editEventId.value=o.id;eventTitle.value=o.title;eventTime.value=o.time||'';eventReminder.value=o.rem||'none';eventMemo.value=o.memo||''}function delEvent(id){if(!confirm('삭제할까요?'))return;E[sel]=(E[sel]||[]).filter(x=>x.id!==id);if(!E[sel].length)delete E[sel];save();renderEvents();render()}
function openSettings(){sTeam.value=S.team;sDS.value=S.ds;sDE.value=S.de;sNS.value=S.ns;sNE.value=S.ne;sWake.value=S.wake;sBase.value=S.base;sBaseShift.value=S.baseShift;years();tab('work');settingsModal.classList.add('open')}function saveSettings(){S={team:sTeam.value||'A조',ds:sDS.value||'06:45',de:sDE.value||'15:30',ns:sNS.value||'15:35',ne:sNE.value||'00:20',wake:sWake.value||'04:50',base:sBase.value||'2026-08-10',baseShift:sBaseShift.value};save();render();alert('저장했습니다.')}
function tab(n){[['work','tw','pw'],['holiday','th','ph'],['data','td','pd']].forEach(a=>{document.getElementById(a[1]).classList.toggle('on',a[0]===n);document.getElementById(a[2]).classList.toggle('on',a[0]===n)})}function years(pref){let ys=Object.keys(H).sort();hYear.innerHTML=ys.map(y=>`<option>${y}</option>`).join('');if(pref&&ys.includes(pref))hYear.value=pref;renderHolidayList()}function addYear(){let y=prompt('추가할 연도 예: 2027');if(!y)return;if(!/^\d{4}$/.test(y))return alert('4자리 연도를 입력해주세요.');if(H[y])return alert('이미 있습니다.');H[y]=[];save();years(y)}
function renderHolidayList(){let y=hYear.value,a=H[y]||[];holidayList.innerHTML=a.length?a.map((o,i)=>`<div class="item"><div><div class="it">${esc(o.name)}</div><div class="im">${o.start}${o.end!==o.start?' ~ '+o.end:''}</div></div><div class="ib"><button class="small edit" onclick="editHoliday(${i})">수정</button><button class="small del" onclick="delHoliday(${i})">삭제</button></div></div>`).join(''):'<div class="emptyState">등록된 휴무가 없습니다.</div>'}function editHoliday(i){let o=H[hYear.value][i];hEdit.value=i;hName.value=o.name;hStart.value=o.start;hEnd.value=o.end}function saveHoliday(){let y=hYear.value,n=hName.value.trim(),s=hStart.value,e=hEnd.value||s;if(!n||!s)return alert('휴무명과 날짜를 입력해주세요.');if(!s.startsWith(y+'-')||!e.startsWith(y+'-'))return alert(y+'년 날짜를 선택해주세요.');let o={name:n,start:s,end:e};hEdit.value!==''?H[y][Number(hEdit.value)]=o:H[y].push(o);H[y].sort((a,b)=>a.start.localeCompare(b.start));hEdit.value='';hName.value=hStart.value=hEnd.value='';save();renderHolidayList();render()}function delHoliday(i){if(!confirm('삭제할까요?'))return;H[hYear.value].splice(i,1);save();renderHolidayList();render()}
function download(n,t){let b=new Blob([t],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),300)}function exportBackup(){download(`ShiftMate_backup_${key(new Date())}.json`,JSON.stringify({S,H,E},null,2))}async function importBackup(){let f=backupFile.files[0];if(!f)return alert('파일을 선택해주세요.');try{let o=JSON.parse(await f.text());if(!o.S||!o.H||!o.E)throw 0;if(!confirm('현재 데이터를 교체할까요?'))return;S=o.S;H=o.H;E=o.E;save();years();render();alert('복원했습니다.')}catch(e){alert('올바른 백업 파일이 아닙니다.')}}function resetApp(){if(!confirm('모든 사용자 데이터를 초기화할까요?'))return;S={...DEF};H={'2026':H26};E={};save();closeM('settingsModal');render()}
async function askNotify(){if(!('Notification'in window))return alert('이 브라우저는 웹 알림을 지원하지 않습니다.');let p=await Notification.requestPermission();if(p==='granted')new Notification('ShiftMate',{body:'알림 권한이 허용되었습니다.'})}
function checkNotify(){if(!('Notification'in window)||Notification.permission!=='granted')return;let n=new Date(),hm=`${pad(n.getHours())}:${pad(n.getMinutes())}`;if(hm===S.wake&&shift(n)==='주간'){let k='sm.notify.'+key(n);if(!sessionStorage.getItem(k)){new Notification('기상 시간',{body:`${S.team} 주간근무 · ${S.ds} 출근`});sessionStorage.setItem(k,'1')}}}
setInterval(checkNotify,30000);function closeM(id){document.getElementById(id).classList.remove('open')}document.querySelectorAll('.overlay').forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('open')});render();
</script>
